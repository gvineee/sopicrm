name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Points the app at the ephemeral Postgres/Redis service containers below,
  # overriding whatever .env.example would otherwise set (Laravel/phpdotenv
  # never overwrites an already-set real environment variable).
  DB_CONNECTION: pgsql
  DB_HOST: 127.0.0.1
  DB_PORT: 5432
  DB_DATABASE: oda_crm_test
  DB_USERNAME: oda_app
  DB_PASSWORD: secret
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: 6379
  QUEUE_CONNECTION: sync
  SESSION_DRIVER: array
  CACHE_STORE: array
  MAIL_MAILER: log

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: oda_crm_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oda_crm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql, pgsql, bcmath, zip, intl, gd, mbstring, curl, redis
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      # docs/architecture.md §4 (DEC-016): Postgres RLS is a no-op for
      # superusers regardless of FORCE ROW LEVEL SECURITY, and the official
      # postgres image's POSTGRES_USER is created AS a superuser by default.
      # tests/Feature/Auth/TenantIsolationRlsTest.php explicitly asserts the
      # connection it runs as is NOT a superuser (failing loudly, not
      # silently passing-but-meaningless, if this step is ever skipped) —
      # per the spec's "tested with a real runtime DB role" requirement.
      #
      # The app role is created here as a separate, ordinary role rather than
      # by stripping SUPERUSER from POSTGRES_USER: that user is the cluster's
      # bootstrap superuser, and PostgreSQL 16 refuses to remove the attribute
      # from it — which is the step every recent CI run failed on. Owning the
      # database is enough to run every migration, including
      # `create extension btree_gist` (a trusted extension).
      - name: Create the non-superuser app role (RLS must be real)
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d oda_crm_test -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE oda_app LOGIN PASSWORD 'secret' NOSUPERUSER;" \
            -c "ALTER DATABASE oda_crm_test OWNER TO oda_app;" \
            -c "ALTER SCHEMA public OWNER TO oda_app;"

      - name: Lint (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (PHPStan / Larastan)
        run: composer run types:check

      # Verifies the migration set actually applies to real PostgreSQL (catches
      # Postgres-specific issues sqlite would hide — numeric precision, RLS,
      # btree_gist, etc., per docs/architecture.md §4).
      - name: Run migrations against test database
        run: php artisan migrate --force --no-interaction

      # The bulk of the suite runs against its own sqlite in-memory DB per
      # phpunit.xml (the documented convention for fast feedback loops,
      # docs/architecture.md §3.5/§3.6). The one exception is
      # tests/Feature/Auth/TenantIsolationRlsTest.php, which explicitly opens
      # its OWN connection (config/database.php `pgsql_rls_test`) to this
      # same real Postgres database as the restricted `oda_app` role and
      # `migrate:fresh`-es it again itself — proving Postgres RLS actually
      # blocks cross-tenant reads with a real runtime DB role, per spec
      # sections 18/23, not just sqlite-backed Eloquent-scope assertions.
      - name: Pest test suite
        run: php artisan test

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend typecheck
        run: npm run types:check

      - name: Frontend production build
        run: npm run build
